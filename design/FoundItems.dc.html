<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enough — Found items</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Caveat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Archivo',sans-serif;background:#F2F1EC;color:#101014}
a{color:#3346D3}a:hover{color:#26379F}
.m{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.cap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#5B5B66}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;height:56px;background:#3346D3;color:#FFFFFF;border-radius:6px;font-size:17px;font-weight:700;text-decoration:none;border:0;width:100%;font-family:inherit;cursor:pointer}
.btn:hover{background:#26379F;color:#FFFFFF}
.x{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-10px;border:0;background:transparent;color:#5B5B66;cursor:pointer;border-radius:6px}
.x:hover{color:#C4320F}
</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #F2F1EC; color: #101014; font-family: 'Archivo', sans-serif; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="WhatWeKeep.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #101014"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex-grow: 1; height: 4px; background: #DEDDD5; border-radius: 2px; overflow: hidden"><div style="width: 62%; height: 4px; background: #3346D3"></div></div>
    <div class="m" style="font-size: 12px; color: #5B5B66">3/4</div>
  </div>

  <h1 style="margin: 0; font-size: 32px; line-height: 1.04; font-weight: 800; font-stretch: 115%; letter-spacing: -1px">9 things you pay for again and again.</h1>
  <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #5B5B66">Remove anything that isn't right. Add what we missed.</p>

  <div style="background: #FFFFFF; border: 1px solid #D5D4CC; border-radius: 8px; padding: 4px 16px">
    <div style="display: flex; justify-content: space-between; padding: 10px 44px 8px 0"><span class="cap">Item</span><span class="cap">Per year</span></div>
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="9">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 60px; border-top: 1px solid #DEDDD5">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">{{ item.name }}</span><span class="m" style="font-size: 11px; color: #5B5B66">{{ item.meta }}</span></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span class="m" style="font-size: 15px; font-weight: 600">{{ item.year }}</span><span class="m" style="font-size: 11px; color: #5B5B66">{{ item.month }}</span></div>
        <button class="x" aria-label="Remove {{ item.name }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-for>
  </div>

  <button style="height: 48px; border-radius: 6px; border: 1.5px dashed #9C9B93; background: transparent; color: #3346D3; font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">+ Add something we missed</button>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; color: #5B5B66; text-align: center">1 of these needs a quick word from you.</div>
    <a href="WhatIsThis.dc.html" class="btn">Looks right</a>
  </div>
</div>
</x-dc>

</body>
</html>
